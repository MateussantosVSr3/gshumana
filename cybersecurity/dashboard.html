<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Risco Cidadão</title><style>body{font:18px system-ui;margin:40px;background:#f5fafb;color:#17343d}.card{max-width:700px;background:white;padding:28px;border-radius:16px}.score{font-size:64px;font-weight:800;color:#b42318}label{display:block;margin:16px 0}button{font-size:18px;padding:12px;background:#006d77;color:#fff;border:0;border-radius:8px}</style><main class="card"><h1>Indicador Risco Cidadão</h1><div class="score"><span id="score">0</span>/100</div><p id="level">baixo</p><label>Achados PII <input id="pii" type="number" min="0" value="0"></label><label><input id="public" type="checkbox"> Exposição pública</label><label><input id="plain" type="checkbox"> Sem criptografia</label><label><input id="open" type="checkbox"> Sem controle de acesso</label><button onclick="calc()">Calcular</button><pre id="audit"></pre></main><script>function calc(){const n=+pii.value*20+(public.checked?35:0)+(plain.checked?25:0)+(open.checked?20:0),s=Math.min(100,n);score.textContent=s;level.textContent=s>=70?'crítico':s>=40?'alto':s>=20?'moderado':'baixo';audit.textContent=JSON.stringify({at:new Date().toISOString(),pii:+pii.value,score:s},null,2)}if(new URLSearchParams(location.search).get('demo')==='critical'){pii.value=2;public.checked=true;plain.checked=true;open.checked=true;calc()}</script></html>
